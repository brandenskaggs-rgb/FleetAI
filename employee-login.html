<!doctype html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/css/theme.css" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fleet AI Employee Portal</title>
  <link rel="stylesheet" href="/css/site-tokens.css" />
  <link rel="stylesheet" href="/css/site-theme.css" />
  <link rel="stylesheet" href="/css/site-components.css" />
  <link rel="stylesheet" href="/css/site-layout.css" />
  <link rel="stylesheet" href="/css/design-system.css" />
</head>
<body>
  <header class="siteHeader">
    <div class="container siteHeader__row">
      <a class="wordmark" href="/index.html"><span class="brandFleet">Fleet</span><span class="brandAI">AI</span></a>
      <div class="siteActions">
        <select class="themeSelect" id="siteThemeSelect" aria-label="Theme">
          <option value="light-blue">Light</option>
          <option value="dark-blue">Dark Blue</option>
          <option value="dark-gray">Dark Gray</option>
        </select>
        <a class="btn secondary" href="/index.html">Back to Fleet AI Home</a>
      </div>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="sectionHeader">
        <h2>Fleet AI Employee Portal</h2>
        <p>Internal access only</p>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <p class="card__meta">This portal is for Fleet AI employees and authorized support personnel only. Customer accounts do not apply here.</p>
      </div>
      <form class="formCard" id="employeeLoginForm" style="max-width:520px; position:relative; z-index:2;">
        <div id="loginError" class="formError" style="display:none;"></div>
        <label>
          Email
          <input id="employeeEmail" type="email" placeholder="name@fleetai.com" required />
        </label>
        <label>
          Password
          <input id="employeePassword" type="password" placeholder="********" required />
        </label>
        <label>
          2FA Code (optional)
          <input id="employee2fa" type="text" placeholder="123456" />
        </label>
        <div class="heroActions">
          <button class="btn primary" id="employeeSignIn" type="submit">Sign In</button>
          <a class="btn secondary" href="/index.html">Back to Fleet AI Home</a>
        </div>
        <details id="employeeDebugPanel" style="margin-top:12px;">
          <summary style="cursor:pointer;">Auth Debug</summary>
          <div class="muted" style="margin-top:8px;">
            <div>Endpoint: <span id="dbgEndpoint">--</span></div>
            <div>Last status: <span id="dbgStatus">--</span></div>
            <div>Last error: <span id="dbgError">--</span></div>
          </div>
        </details>
      </form>
    </div>
  </section>

  <script src="/js/site.js"></script>
  <script src="/ui/js/apiConfig.js"></script>
  <script src="/js/scroll-reveal.js"></script>
  <script src="/public/js/employee-login.js" defer></script>
</body>
</html>
