<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet AI Brand Downloads</title>
  <style>
    body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:#f7faff;color:#0b2346}
    main{max-width:760px;margin:0 auto;padding:48px 24px}
    h1{font-size:32px;margin:0 0 10px}
    p{color:#5f6f89;line-height:1.5}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:28px}
    .card{background:#fff;border:1px solid #dbe5f4;border-radius:14px;padding:18px;box-shadow:0 18px 40px rgba(15,34,70,.08)}
    img{display:block;max-width:100%;height:86px;object-fit:contain;margin:10px 0 18px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:10px;background:#1463ff;color:#fff;text-decoration:none;font-weight:800}
    .secondary{background:#0b2346}
  </style>
</head>
<body>
  <main>
    <h1>Fleet AI Brand Downloads</h1>
    <p>Use the ZIP if your browser opens SVG files instead of downloading them.</p>
    <div class="grid">
      <div class="card">
        <strong>Full Logo</strong>
        <img src="fleet-ai-logo.svg" alt="Fleet AI full logo">
        <a href="fleet-ai-logo.svg" download>Download SVG</a>
      </div>
      <div class="card">
        <strong>Icon Mark</strong>
        <img src="fleet-ai-mark.svg" alt="Fleet AI icon mark">
        <a href="fleet-ai-mark.svg" download>Download SVG</a>
      </div>
      <div class="card">
        <strong>Brand Bundle</strong>
        <img src="fleet-ai-mark.svg" alt="Fleet AI icon mark">
        <a class="secondary" href="fleet-ai-brand-assets.zip" download>Download ZIP</a>
      </div>
    </div>
  </main>
</body>
</html>
