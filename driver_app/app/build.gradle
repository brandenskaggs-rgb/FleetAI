plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.fleetai.driver'
    compileSdk 34

    defaultConfig {
        applicationId "com.fleetai.driver"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Set FLEETAI_BASE_URL in gradle.properties or via -PFLEETAI_BASE_URL=https://...
        // to point the driver app at your Fleet AI server (e.g. the Railway deployment).
        def baseUrl = project.findProperty("FLEETAI_BASE_URL") ?: "https://fleetaiops.com"
        // Cleartext is denied by res/xml/network_security_config.xml except for
        // loopback, so a plain-http base would fail at runtime rather than
        // silently sending the driver PIN and device token unencrypted. Catch
        // it at build time instead, where it is obvious.
        if (!baseUrl.startsWith("https://")
                && !baseUrl.startsWith("http://localhost")
                && !baseUrl.startsWith("http://127.0.0.1")
                && !baseUrl.startsWith("http://10.0.2.2")) {
            throw new GradleException(
                "FLEETAI_BASE_URL must use https:// (or be a loopback address for local development). Got: ${baseUrl}")
        }
        buildConfigField "String", "BASE_URL", "\"${baseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libdatastore_shared_counter.so']
        }
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.01')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    implementation 'com.squareup.moshi:moshi:1.15.1'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'

    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Firebase Cloud Messaging — push notifications to the driver.
    //
    // NOT CONFIGURED. There is no app/google-services.json and the
    // com.google.gms.google-services plugin is not applied, so FirebaseApp
    // never initialises: FleetMessagingService is declared in the manifest but
    // can never receive a message. The app builds and runs correctly; push is
    // simply inert, and nothing on the pairing / OBD / telemetry path depends
    // on it.
    //
    // To enable: create a Firebase project, download google-services.json into
    // driver_app/app/, add `id 'com.google.gms.google-services'` to the plugins
    // block here and the matching classpath to the root build.gradle.
    implementation 'com.google.firebase:firebase-messaging:23.4.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
