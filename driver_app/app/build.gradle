plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def uploadStoreFile = project.findProperty("FLEETAI_UPLOAD_STORE_FILE") ?: System.getenv("FLEETAI_UPLOAD_STORE_FILE")
def uploadStorePassword = project.findProperty("FLEETAI_UPLOAD_STORE_PASSWORD") ?: System.getenv("FLEETAI_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = project.findProperty("FLEETAI_UPLOAD_KEY_ALIAS") ?: System.getenv("FLEETAI_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = project.findProperty("FLEETAI_UPLOAD_KEY_PASSWORD") ?: System.getenv("FLEETAI_UPLOAD_KEY_PASSWORD")
def uploadSigningReady = uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

android {
    namespace 'com.fleetai.driver'
    compileSdk 36

    defaultConfig {
        applicationId "com.fleetai.driver"
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName "1.10.0"

        // Set FLEETAI_BASE_URL in gradle.properties or via -PFLEETAI_BASE_URL=https://...
        // to point the driver app at your Fleet AI server (e.g. the Railway deployment).
        def baseUrl = project.findProperty("FLEETAI_BASE_URL") ?: "https://fleetaiops.com"
        // Cleartext is denied by res/xml/network_security_config.xml except for
        // loopback, so a plain-http base would fail at runtime rather than
        // silently sending the driver PIN and device token unencrypted. Catch
        // it at build time instead, where it is obvious.
        if (!baseUrl.startsWith("https://")
                && !baseUrl.startsWith("http://localhost")
                && !baseUrl.startsWith("http://127.0.0.1")
                && !baseUrl.startsWith("http://10.0.2.2")) {
            throw new GradleException(
                "FLEETAI_BASE_URL must use https:// (or be a loopback address for local development). Got: ${baseUrl}")
        }
        buildConfigField "String", "BASE_URL", "\"${baseUrl}\""
    }

    signingConfigs {
        release {
            if (uploadSigningReady) {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ['**/libdatastore_shared_counter.so']
        }
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.01')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    implementation 'com.squareup.moshi:moshi:1.15.1'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'

    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    // 2.9.1 remains on Kotlin 1.9 metadata, matching this app's compiler.
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // USB serial transport for documented SLCAN/Lawicel CAN adapters. This
    // supplies userspace FTDI, CP210x, CH34x, PL2303 and CDC-ACM drivers, so
    // rooted tablets or manufacturer-specific kernel drivers are not needed.
    implementation 'com.github.mik3y:usb-serial-for-android:3.10.0'

    testImplementation 'junit:junit:4.13.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
