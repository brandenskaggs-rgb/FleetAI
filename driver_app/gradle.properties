org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.vfs.watch=false
android.useAndroidX=true
kotlin.code.style=official
# NOTE: no org.gradle.java.installations.paths here on purpose. It previously
# listed Linux JDK paths (/home/... and /usr/lib/jvm/...) which do not exist on
# a Windows workstation, so toolchain resolution had to fall through. Android
# Studio supplies its bundled JBR 17, and a CLI build works with
# JAVA_HOME set to any JDK 17.

# Fleet AI server URL — point this at the Railway deployment for production builds.
# Drivers can still override at runtime via the Connect screen.
FLEETAI_BASE_URL=https://fleetaiops.com
