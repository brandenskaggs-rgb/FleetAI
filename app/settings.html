<!doctype html>
<html lang="en" data-theme="light-blue">
<head>
  <link rel="stylesheet" href="/css/theme.css" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fleet AI - Settings</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="page container">
    <header class="siteHeader">
      <div class="siteHeader__row">
        <div class="brandBlock">
          <div class="brandTitle">Fleet AI - <span id="appOrgName">Organization</span></div>
          <div class="brandMeta">Settings</div>
        </div>
        <div class="headerActions">
          <a class="btn" href="/app/dashboard.html">Dashboard</a>
          <a class="btn" href="/app/billing.html">Billing</a>
          <button class="btn ghost" id="btnAppLogout">Logout</button>
        </div>
      </div>
    </header>

    <section class="section">
      <div class="grid2">
        <div class="Card">
          <div class="Card__hd">
            <h2>Organization</h2>
            <div class="meta">Company branding</div>
          </div>
          <div class="Card__bd">
            <div style="display:grid;gap:12px;">
              <input id="settingsOrgName" type="text" placeholder="Company name" />
              <button class="btn primary" id="btnSaveOrg">Save</button>
              <div class="emptyState" id="settingsMsg" style="display:none;"></div>
            </div>
          </div>
        </div>
        <div class="Card">
          <div class="Card__hd">
            <h2>Theme</h2>
            <div class="meta">Apply a global theme</div>
          </div>
          <div class="Card__bd">
            <div style="display:grid;gap:12px;">
              <select id="themeToggle">
                <option value="light-blue">Light (Cool Blue)</option>
                <option value="dark-blue">Dark Blue</option>
                <option value="dark-gray">Dark Gray</option>
              </select>
              <button class="btn" id="btnApplyTheme">Apply Theme</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/guard.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/settings.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", ()=>{
      const btn = document.getElementById("btnApplyTheme");
      if(btn){
        btn.addEventListener("click", ()=>{
          const val = document.getElementById("themeToggle")?.value;
          if(val) applyTheme(val);
        });
      }
    });
  </script>
</body>
</html>
